<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR File Transfer (offline)</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
      .card { max-width: 640px; margin: 0 auto; padding: 20px; background: #fff;
              min-height: 100vh; display: flex; flex-direction: column; align-items: center;
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
      .title { font-size: 1.25rem; margin: 1rem 0; }
      .message { font-size: 0.9rem; margin: 0 0 1rem; color: #555; text-align: center; }
      a.button { display: block; width: 100%; max-width: 360px; margin: 0.5rem auto; padding: 12px;
                 text-align: center; text-decoration: none; color: #333;
                 border: 2px solid #6b7280; background: #fff; font-size: 1rem; }
      a.button:hover { background: #e5e7eb; }
      a.about { font-size: 0.8rem; color: #555; margin-top: auto; padding-top: 1rem; text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">QR File Transfer (offline)</div>
      <div class="message">These pages are fully self-contained. Open this page once with
        network access so it is cached, then they work offline.</div>
      <a class="button" href="generator.html">Sender (show QR codes)</a>
      <a class="button" href="scanner.html">Receiver (scan with camera)</a>
      <a class="about" href="about.html">About</a>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
