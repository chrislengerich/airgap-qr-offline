<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR File Receiver (offline)</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
      .card { max-width: 640px; margin: 0 auto; padding: 20px; background: #fff;
              min-height: 100vh; display: flex; flex-direction: column; align-items: center;
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
      .title { font-size: 1.25rem; margin: 1rem 0; }
      .message { font-size: 0.9rem; margin: 0 0 1rem; color: #555; text-align: center; }
      button { padding: 8px 16px; border: 2px solid #6b7280; background: #fff;
               cursor: pointer; font-size: 1rem; margin: 0 0 1rem; }
      button:hover { background: #e5e7eb; }
      video { width: 100%; border: 1px solid #ddd; background: #000; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Data Receiver Mode</div>
      <div class="message" id="user_message">Click receive button to start receiving</div>
      <div class="message" id="progress">Progress: 0 / 0</div>
      <button id="btn">Start Receiver</button>
      <video id="video" muted autoplay playsinline></video>
      <canvas id="scan" hidden></canvas>
    </div>
    <script>
__PAKO__
    </script>
    <script>
__JSQR__
    </script>
    <script>
      (function () {
        var user_message = document.getElementById("user_message");
        var progress = document.getElementById("progress");
        var btn = document.getElementById("btn");
        var video = document.getElementById("video");
        var scan = document.getElementById("scan");

        var is_receiving = false, stream = null, meta = {}, decoded = {}, timer = null;

        var decode_data = function (input_string) {
          var encoded_data = atob(input_string.split(",")[1]);
          var encoded_array = Array.from(encoded_data, function (char) {
            return char.charCodeAt(0);
          });
          var output_string = new TextDecoder().decode(new Uint8Array(encoded_array));
          return {
            index: parseInt(input_string.split(",")[0], 10),
            data: Uint8Array.from(output_string, function (char) {
              return char.charCodeAt(0);
            })
          };
        };

        var MAX_CHUNKS = 1000000;
        var MAX_SIZE = 3 * 1024 * 1024 * 1024;
        var MAX_INFLATED = 3 * 1024 * 1024 * 1024; // 3 GiB cap when no size is declared
        var INFLATE_SLACK = 1024 * 1024;           // slack over a declared size before capping

        // Inflate with a hard cap on decompressed output so a decompression bomb
        // cannot exhaust memory before the declared-size check runs. The payload is
        // pushed in slices (pako's documented streaming usage) and the collected
        // output is checked after every emitted block, so inflate aborts as soon as
        // the cap is crossed instead of materializing the whole stream first.
        var safe_inflate = function (data, max_out) {
          var inflator = new pako.Inflate();
          var parts = [], total = 0;
          inflator.onData = function (chunk) {
            parts.push(chunk);
            total += chunk.length;
            if (total > max_out) {
              throw new Error("decompressed data exceeds " + max_out + " bytes");
            }
          };
          var STEP = 1 << 16;
          for (var i = 0; i < data.length; i += STEP) {
            inflator.push(data.subarray(i, Math.min(i + STEP, data.length)));
            if (inflator.err) {
              throw new Error(inflator.msg || "inflate failed");
            }
            if (inflator.ended) break;
          }
          if (!inflator.ended) {
            throw new Error("truncated deflate stream");
          }
          return { parts: parts, length: total };
        };

        var safe_filename = function (name) {
          var n = String(name || "").split(/[\\/]/).pop();
          n = n.replace(/[\u0000-\u001f\u007f]/g, "").trim();
          if (n === "." || n === "..") n = "";
          if (n.length > 200) n = n.slice(0, 200);
          return n || "received_file.bin";
        };

        var valid_meta = function (m) {
          if (!m || typeof m !== "object" || Array.isArray(m)) return false;
          if (typeof m.name !== "string" || m.name.length > 5000) return false;
          if (!Number.isInteger(m.chunks) || m.chunks < 1 || m.chunks > MAX_CHUNKS) return false;
          if (m.size !== undefined && m.size !== null) {
            if (!Number.isInteger(m.size) || m.size < 0 || m.size > MAX_SIZE) return false;
          }
          return true;
        };

        // `parts` is an array of Uint8Array chunks; Blob accepts them directly,
        // which avoids materializing one huge buffer for multi-GiB transfers.
        var download_file = function (parts, fileName) {
          var blob = new Blob(parts);
          var a = document.createElement("a");
          var url = URL.createObjectURL(blob);
          a.href = url;
          a.download = fileName;
          a.click();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        };

        var render = function () {
          var got = Object.keys(decoded).length;
          var total = meta.chunks || 0;
          progress.textContent = "Progress: " + got + " / " + total;
          user_message.textContent = meta.name
            ? ("Transferring file: " + meta.name)
            : "Click receive button to start receiving";
          btn.textContent = is_receiving ? "Stop Receiver" : "Start Receiver";
        };

        var complete = function () {
          var failed = null;
          try {
            var compressed = 0;
            for (var i = 0; i < meta.chunks; i++) {
              compressed += decoded[i].length;
            }
            var unit8 = new Uint8Array(compressed), off = 0;
            for (var i = 0; i < meta.chunks; i++) {
              unit8.set(decoded[i], off);
              off += decoded[i].length;
            }
            var cap = (meta.size !== undefined && meta.size !== null)
              ? meta.size + INFLATE_SLACK
              : MAX_INFLATED;
            var inflated = safe_inflate(unit8, cap);
            if (meta.size !== undefined && meta.size !== null && inflated.length !== meta.size) {
              throw new Error("size mismatch: expected " + meta.size + " bytes, got " + inflated.length);
            }
            download_file(inflated.parts, safe_filename(meta.name));
          } catch (e) {
            failed = e;
          }
          cancelAnimationFrame(timer);
          is_receiving = false;
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          video.srcObject = null;
          meta = {};
          decoded = {};
          render();
          user_message.textContent = failed
            ? "Transfer failed: " + (failed.message || String(failed))
            : "Data Transfer Complete";
        };

        var scan_frame = function () {
          if (!is_receiving) return;
          try {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
              var scale = Math.min(1, 640 / video.videoWidth);
              scan.width = Math.round(video.videoWidth * scale);
              scan.height = Math.round(video.videoHeight * scale);
              var ctx = scan.getContext("2d", { willReadFrequently: true });
              ctx.drawImage(video, 0, 0, scan.width, scan.height);
              var image = ctx.getImageData(0, 0, scan.width, scan.height);
              var code = jsQR(image.data, scan.width, scan.height);
              if (code) {
                var data = code.data;
                if (data.charAt(0) === "{") {
                  try {
                    var m = JSON.parse(data);
                    if (valid_meta(m) &&
                        (m.name !== meta.name || m.chunks !== meta.chunks || m.size !== meta.size)) {
                      meta = m;
                      decoded = {};
                    }
                  } catch (e) { /* ignore malformed metadata */ }
                } else if (data.split(",").length === 2) {
                  try {
                    var raw = decode_data(data);
                    if (Number.isInteger(raw.index) && raw.index >= 0 &&
                        (!meta.chunks || raw.index < meta.chunks)) {
                      decoded[raw.index] = raw.data;
                    }
                  } catch (e) { /* ignore malformed chunk */ }
                }
                render();
              }
              if (meta.chunks && Object.keys(decoded).length >= meta.chunks) {
                complete();
                return;
              }
            }
          } catch (e) {
            /* skip unreadable frame */
          }
          timer = requestAnimationFrame(scan_frame);
        };

        btn.addEventListener("click", function () {
          if (is_receiving) {
            is_receiving = false;
            cancelAnimationFrame(timer);
            if (stream) {
              stream.getTracks().forEach(function (t) { t.stop(); });
              stream = null;
            }
            video.srcObject = null;
            meta = {};
            decoded = {};
            render();
            return;
          }
          is_receiving = true;
          decoded = {};
          meta = {};
          render();
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            is_receiving = false;
            render();
            user_message.textContent =
              "Camera unavailable: this page must be opened from a secure context " +
              "(e.g. http://localhost) to access the camera.";
            return;
          }
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function (s) {
              if (!is_receiving) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
              stream = s;
              video.srcObject = s;
              scan_frame();
            })
            .catch(function (e) {
              is_receiving = false;
              user_message.textContent = "Camera error: " + e.message;
              render();
            });
        });

        render();
      })();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
