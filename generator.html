<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Sender Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>
        <div class="w-1/2 mb-4">
          <input
            class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
            id="file_input"
            ref="file_input_ref"
            type="file"
            :disabled="has_text"
            @change="on_file_change"
          />
        </div>
        <div class="w-1/2 mb-4">
          <textarea
            class="block w-full text-sm text-gray-900 border border-gray-300 bg-gray-50 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
            id="text_input"
            v-model="text_input"
            :disabled="has_file"
            @input="sync_input_states"
            rows="5"
            placeholder="Or paste text to send as a file (takes priority over the selected file)"
          ></textarea>
        </div>
        <button
          v-if="!is_transferring"
          v-on:click="start_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Transfer
        </button>
        <button
          v-else
          v-on:click="stop_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Transfer
        </button>
        <div id="qrcode" class=""></div>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, computed, onMounted } = Vue;

      createApp({
        setup() {
          const user_message = ref("Choose a file or paste text to get started");
          const is_transferring = ref(false);
          const text_input = ref("");
          const file_input_ref = ref(null);
          const has_file = ref(false);
          const chunk_size = 250;
          const MAX_TEXT_LENGTH = 1000000;
          let qrcode_object = "";
          let current_name = "";

          const has_text = computed(() => text_input.value.trim() !== "");

          const paste_name = () => {
            const pad2 = (n) => String(n).padStart(2, "0");
            const d = new Date();
            return (
              "Paste @ " +
              d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
              "_" + pad2(d.getHours()) + "-" + pad2(d.getMinutes()) + "-" + pad2(d.getSeconds())
            );
          };

          const sync_input_states = () => {
            if (has_text.value && file_input_ref.value) {
              file_input_ref.value.value = "";
              has_file.value = false;
            }
          };

          const on_file_change = () => {
            has_file.value = !!(
              file_input_ref.value && file_input_ref.value.files.length > 0
            );
          };

          const encode_data = (index, input_bytes) => {
            let encoded_string = String.fromCharCode.apply(null, input_bytes);
            let utf8Encoder = new TextEncoder();
            let utf8_bytes = utf8Encoder.encode(encoded_string);
            let encoded_data = btoa(
              String.fromCharCode.apply(null, utf8_bytes)
            );
            return index + "," + encoded_data;
          };

          const safe_name = (name) => {
            let n = String(name || "").split(/[\\/]/).pop();
            n = n.replace(/[\u0000-\u001f\u007f]/g, "").trim();
            if (n === "." || n === "..") n = "";
            if (n.length > 200) n = n.slice(0, 200);
            return n || "file.bin";
          };

          const valid_text = (text) => {
            if (typeof text !== "string" || text.length === 0) {
              return { ok: false, error: "Text is empty" };
            }
            if (text.length > MAX_TEXT_LENGTH) {
              return {
                ok: false,
                error: `Text too long: ${text.length} characters (max ${MAX_TEXT_LENGTH})`,
              };
            }
            for (let i = 0; i < text.length; i++) {
              const c = text.charCodeAt(i);
              if (c >= 0xd800 && c <= 0xdfff) {
                if (c <= 0xdbff) {
                  if (i + 1 >= text.length) {
                    return { ok: false, error: "Text contains an unpaired surrogate" };
                  }
                  const next = text.charCodeAt(i + 1);
                  if (!(next >= 0xdc00 && next <= 0xdfff)) {
                    return { ok: false, error: "Text contains invalid Unicode characters" };
                  }
                  i++;
                } else {
                  return { ok: false, error: "Text contains invalid Unicode characters" };
                }
              }
            }
            return { ok: true };
          };

          const stop_transfer = () => {
            is_transferring.value = false;
            user_message.value = "Choose a file or paste text to get started";
            if (qrcode_object) {
              qrcode_object.clear();
              qrcode_object.makeCode("Choose a file or paste text to get started");
            }
          };

          const start_transfer = async () => {
            let file_input = document.getElementById("file_input");
            const text = text_input.value;
            let bytes, name;
            if (text.trim() !== "") {
              const check = valid_text(text);
              if (!check.ok) {
                user_message.value = check.error;
                return;
              }
              bytes = new TextEncoder().encode(text);
              name = safe_name(paste_name());
            } else {
              const file = file_input.files[0];
              if (!file) {
                user_message.value = "Choose a file or paste text to get started";
                return;
              }
              bytes = new Uint8Array(await file.arrayBuffer());
              name = safe_name(file.name);
            }
            current_name = name;
            user_message.value = `Sending "${current_name}"`;
            is_transferring.value = true;
            let data_array = pako.gzip(bytes, { level: 9 });
            let total_chunks = Math.ceil(data_array.length / chunk_size);
            let file_metadata = { name: name, chunks: total_chunks, size: bytes.length };
            let frames = [JSON.stringify(file_metadata)];
            for (let i = 0; i < total_chunks; i++) {
              let start = i * chunk_size;
              let chunk = data_array.subarray(start, start + chunk_size);
              frames.push(encode_data(i, chunk));
            }
            let idx = 0;
            while (is_transferring.value) {
              qrcode_object.clear();
              qrcode_object.makeCode(frames[idx]);
              user_message.value = idx === 0
                ? `Sending "${current_name}" - scan the metadata QR code`
                : `Transferring "${current_name}" (chunk ${idx}/${total_chunks})`;
              await new Promise((r) => setTimeout(r, 250));
              idx = (idx + 1) % frames.length;
            }
            stop_transfer();
          };

          onMounted(() => {
            console.log("Application Initialized ...");
            let lowest_size =
              Math.min(window.innerWidth, window.innerHeight) / 1.5;
            qrcode_object = new QRCode("qrcode", {
              text: "Choose file to get started",
              width: lowest_size,
              height: lowest_size,
              typeNumber: 40,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M,
            });
          });

          return {
            user_message,
            start_transfer,
            stop_transfer,
            is_transferring,
            text_input,
            file_input_ref,
            has_text,
            has_file,
            sync_input_states,
            on_file_change,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
